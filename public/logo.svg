<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 140" width="100%" height="100%" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&amp;family=Outfit:wght@700;800;900&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap');
      .brand-name {
        font-family: 'Outfit', 'Plus Jakarta Sans', 'Segoe UI', system-ui, sans-serif;
        font-weight: 800;
        font-size: 46px;
        fill: #ffffff;
        letter-spacing: -0.01em;
      }
      .brand-sub {
        font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.06em;
        fill: #ffffff;
      }
    </style>
  </defs>

  <!-- Speed trails to the left of T -->
  <g transform="translate(18, 54)" fill="#ffffff">
    <!-- Line 1 -->
    <circle cx="6" cy="6" r="3.2" />
    <circle cx="17" cy="6" r="3.2" />
    <rect x="25" y="3" width="18" height="6.4" rx="3.2" />

    <!-- Line 2 -->
    <circle cx="2" cy="17" r="3.2" />
    <circle cx="12" cy="17" r="3.2" />
    <rect x="20" y="14" width="23" height="6.4" rx="3.2" />

    <!-- Line 3 -->
    <circle cx="6" cy="28" r="3.2" />
    <circle cx="17" cy="28" r="3.2" />
    <rect x="25" y="25" width="18" height="6.4" rx="3.2" />

    <!-- Line 4 -->
    <circle cx="12" cy="39" r="3.2" />
    <circle cx="22" cy="39" r="3.2" />
  </g>

  <!-- Chef Hat on top of T -->
  <g transform="translate(68, 12)">
    <!-- Hat Puffs -->
    <path 
      d="M 12 34 C 4 30 2 18 10 12 C 9 3 22 -1 32 3 C 40 -2 52 1 54 11 C 62 14 63 28 52 34 Z" 
      fill="none" 
      stroke="#ffffff" 
      stroke-width="5" 
      stroke-linecap="round" 
      stroke-linejoin="round"
    />
    <!-- Hat Brim Bands -->
    <path d="M 10 34 Q 31 41 52 34" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round"/>
    <path d="M 14 39 Q 31 45 48 39" fill="none" stroke="#ffffff" stroke-width="3.8" stroke-linecap="round"/>
  </g>

  <!-- Brand Typography -->
  <text x="68" y="86" class="brand-name">TasteNest</text>
  <text x="70" y="106" class="brand-sub">Fast Food Restaurant</text>

  <!-- Smile Swoosh & Tongue under "Nest" -->
  <g transform="translate(204, 90)">
    <!-- Smile swoop -->
    <path d="M 4 8 Q 38 28 72 8" fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"/>
    <!-- Tongue hanging down -->
    <path d="M 52 17 C 52 30 70 30 68 15 C 68 9 58 11 52 17 Z" fill="#ffffff"/>
  </g>
</svg>
